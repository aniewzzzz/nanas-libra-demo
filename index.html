  --heart-pull:clamp(0, (var(--heart-gather, 0) - var(--heart-delay)) * 1.28, 1);

  top:calc(var(--heart-y) + (43% - var(--heart-y)) * var(--heart-pull));
  translate:calc(-50% * var(--heart-pull)) calc(-50% * var(--heart-pull));
  scale:calc(1 - .96 * var(--heart-pull));
  opacity:calc(var(--heart-opacity) * (1 - .47 * var(--heart-pull)) * var(--heart-visibility, 1));
